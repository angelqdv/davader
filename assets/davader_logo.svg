<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="crimson-glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <linearGradient id="d-border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#f43f5e"/>
      <stop offset="50%"  stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#881337"/>
    </linearGradient>
  </defs>

  <!-- D — forma exterior con resplandor carmesí -->
  <path d="M16 12 L52 12 C78 12 90 28 90 50 C90 72 78 88 52 88 L16 88 Z"
        fill="#0c0d12" stroke="url(#d-border-grad)" stroke-width="3.5"/>

  <!-- Casco Darth Vader calibrado por el usuario (scale 0.54, horizontal 50.5, vertical 52.5) -->
  <g transform="translate(50.5, 52.5) scale(0.54)">
    <!-- Cúpula principal -->
    <path d="M -45 -15 C -45 -55 -25 -65 0 -65 C 25 -65 45 -55 45 -15
             C 45 5 52 25 56 32 L -56 32 C -52 25 -45 5 -45 -15 Z"
          fill="#09090b" stroke="#e11d48" stroke-width="3.2"/>
    <!-- Alas laterales -->
    <path d="M -56 32 L -42 22 L -38 0 L -45 -15" fill="none" stroke="#f43f5e" stroke-width="2.4"/>
    <path d="M  56 32 L  42 22 L  38 0 L  45 -15" fill="none" stroke="#f43f5e" stroke-width="2.4"/>
    <!-- Cresta central -->
    <line x1="0" y1="-65" x2="0" y2="-15" stroke="#f43f5e" stroke-width="3.2"/>
    <!-- Ojos angulares con resplandor carmesí imperial -->
    <path d="M -26 -14 L -8 -11 L -12 -3 L -27 -6 Z" fill="#e11d48" filter="url(#crimson-glow)"/>
    <path d="M  26 -14 L  8 -11 L  12 -3 L  27 -6 Z" fill="#e11d48" filter="url(#crimson-glow)"/>
    <!-- Puente nasal -->
    <polygon points="-5,-12 5,-12 3,2 -3,2" fill="#374151" stroke="#f43f5e" stroke-width="1.3"/>
    <!-- Respirador triangular -->
    <polygon points="0,5 -18,28 18,28" fill="#181a24" stroke="#e11d48" stroke-width="2.6"/>
    <!-- Rejilla respirador -->
    <line x1="-8"  y1="17" x2="8"  y2="17" stroke="#f43f5e" stroke-width="2.2"/>
    <line x1="-12" y1="23" x2="12" y2="23" stroke="#f43f5e" stroke-width="2.2"/>
    <circle cx="-5" cy="27" r="1.8" fill="#e11d48"/>
    <circle cx=" 5" cy="27" r="1.8" fill="#e11d48"/>
  </g>
</svg>