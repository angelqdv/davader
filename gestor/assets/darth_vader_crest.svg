<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <!-- Filtros de sombra y resplandor -->
    <filter id="crimson-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <!-- Degradados -->
    <linearGradient id="shield-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="50%" stop-color="#09090b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <linearGradient id="crimson-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff1e42" />
      <stop offset="100%" stop-color="#990018" />
    </linearGradient>

    <linearGradient id="metal-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="50%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>
  </defs>

  <!-- Escudo Base Exterior -->
  <path d="M 100 8 Q 175 14 186 65 Q 190 145 100 212 Q 10 145 14 65 Q 25 14 100 8 Z" 
        fill="url(#shield-bg)" stroke="url(#metal-border)" stroke-width="6" />

  <!-- Borde interior fino carmesí -->
  <path d="M 100 18 Q 165 24 174 68 Q 177 138 100 198 Q 23 138 26 68 Q 35 24 100 18 Z" 
        fill="none" stroke="#e11d48" stroke-width="1.8" opacity="0.8" />

  <!-- Franja superior con estrellas -->
  <g fill="#f43f5e">
    <!-- Estrellas de campeonato -->
    <polygon points="100,28 103,36 111,36 105,41 107,49 100,44 93,49 95,41 89,36 97,36" />
    <polygon points="76,33 78,39 84,39 80,43 81,49 76,45 71,49 72,43 68,39 74,39" transform="scale(0.8) translate(22, 5)" />
    <polygon points="124,33 126,39 132,39 128,43 129,49 124,45 119,49 120,43 116,39 122,39" transform="scale(0.8) translate(30, 5)" />
  </g>

  <!-- Silueta Estilizada del Casco de Darth Vader -->
  <g transform="translate(100, 102) scale(0.85)">
    <!-- Cúpula del casco exterior -->
    <path d="M -45 -15 C -45 -55 -25 -65 0 -65 C 25 -65 45 -55 45 -15 C 45 5 52 25 56 32 L -56 32 C -52 25 -45 5 -45 -15 Z" 
          fill="#111827" stroke="#e11d48" stroke-width="2.5" />
    
    <!-- Alas laterales del casco -->
    <path d="M -56 32 L -42 22 L -38 0 L -45 -15" fill="none" stroke="#f43f5e" stroke-width="2" />
    <path d="M 56 32 L 42 22 L 38 0 L 45 -15" fill="none" stroke="#f43f5e" stroke-width="2" />

    <!-- Cresta central -->
    <line x1="0" y1="-65" x2="0" y2="-15" stroke="#f43f5e" stroke-width="2.5" />

    <!-- Ojos / Lentes angulares -->
    <path d="M -26 -14 L -8 -11 L -12 -3 L -27 -6 Z" fill="#e11d48" opacity="0.95" filter="url(#crimson-glow)" />
    <path d="M 26 -14 L 8 -11 L 12 -3 L 27 -6 Z" fill="#e11d48" opacity="0.95" filter="url(#crimson-glow)" />

    <!-- Puente de la nariz -->
    <polygon points="-5,-12 5,-12 3,2 -3,2" fill="#374151" stroke="#f43f5e" stroke-width="1" />

    <!-- Respirador triangular inferior -->
    <polygon points="0,5 -18,28 18,28" fill="#1f2937" stroke="#e11d48" stroke-width="2" />
    
    <!-- Rejilla del respirador -->
    <line x1="-8" y1="17" x2="8" y2="17" stroke="#f43f5e" stroke-width="1.5" />
    <line x1="-12" y1="23" x2="12" y2="23" stroke="#f43f5e" stroke-width="1.5" />
    <circle cx="-5" cy="27" r="1.5" fill="#e11d48" />
    <circle cx="5" cy="27" r="1.5" fill="#e11d48" />
  </g>

  <!-- Cinta con el Nombre del Equipo -->
  <path d="M 30 162 L 170 162 L 158 184 L 42 184 Z" fill="url(#crimson-gradient)" stroke="#18181b" stroke-width="2" />
  <text x="100" y="178" font-family="'Impact', 'Arial Black', sans-serif" font-size="13" font-weight="900" 
        letter-spacing="1.5" fill="#ffffff" text-anchor="middle">
    DARTH VADER
  </text>
  
  <!-- Detalle FC inferior -->
  <text x="100" y="196" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="bold" 
        letter-spacing="2" fill="#f43f5e" text-anchor="middle">
    FOOTBALL CLUB
  </text>
</svg>
