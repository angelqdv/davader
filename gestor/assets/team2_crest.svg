<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 220" width="100%" height="100%">
  <defs>
    <linearGradient id="shield-crimson" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#991b1b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>
    <linearGradient id="silver-border" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="fire-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>
  <!-- Sombra exterior -->
  <path d="M 100 8 C 155 8, 185 28, 185 85 C 185 155, 145 195, 100 215 C 55 195, 15 155, 15 85 C 15 28, 45 8, 100 8 Z" fill="rgba(0,0,0,0.3)" transform="translate(0, 4)" />
  <!-- Borde plateado -->
  <path d="M 100 8 C 155 8, 185 28, 185 85 C 185 155, 145 195, 100 215 C 55 195, 15 155, 15 85 C 15 28, 45 8, 100 8 Z" fill="url(#silver-border)" />
  <!-- Fondo escudo carmesí -->
  <path d="M 100 16 C 148 16, 175 34, 175 85 C 175 148, 140 185, 100 203 C 60 185, 25 148, 25 85 C 25 34, 52 16, 100 16 Z" fill="url(#shield-crimson)" />
  <!-- Rayo / Relámpago central -->
  <polygon points="105,40 75,105 98,105 85,165 125,95 102,95" fill="url(#fire-gradient)" stroke="#fef08a" stroke-width="2" filter="drop-shadow(0 2px 5px rgba(239,68,68,0.5))" />
</svg>
